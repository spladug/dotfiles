# Keep Bluetooth headsets in A2DP (high-quality stereo) at all times.
#
# The stock "autoswitch to headset profile" behaviour is described upstream
# as "Always show microphone for Bluetooth headsets, and switch to headset
# mode when recording". It is what creates the bluez_input virtual source
# and the bluez_capture_internal loopback filter, and what drags the AirPods
# into HFP -- collapsing playback to call quality -- the moment any app opens
# a microphone.
#
# With this off the AirPods present a sink and nothing else, and the mic
# chain falls through to the Insta360 / built-in mics as intended.
#
# Profile selection is left to priority: a2dp-sink has profile priority 134
# against headset-head-unit's 7, so A2DP is chosen on every connect.

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
