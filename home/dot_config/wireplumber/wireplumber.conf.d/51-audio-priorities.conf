# Explicit session priorities -- highest wins the default-node election.
#
#   sinks     AirPods Pro (A2DP)  2000  >  laptop speakers          1000
#   sources   Insta360 Link       3000  >  built-in SoundWire mics  1000
#
# The Insta360 is at 3000, not 2000, because papaya's USB DAC mic
# (Generic_USB_Audio capture.0.0) comes in at a stock 2100.
#
# Set explicitly rather than relying on the stock values (AirPods 1010 vs
# speakers 712) so the ordering is readable and a future device cannot
# quietly land in between.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*sof_sdw.HiFi__Speaker__sink"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1000
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.*sof_sdw.HiFi__Mic__source"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1000
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.usb-Insta360.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 3000
      }
    }
  }
]

monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~bluez_output..*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2000
      }
    }
  }
]
