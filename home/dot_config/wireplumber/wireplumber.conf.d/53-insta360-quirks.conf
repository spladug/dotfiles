# Insta360 Link: use software volume, never the hardware mixer.
#
# This device's USB Audio Class mixer is malformed. The kernel complains at
# every enumeration:
#
#   usb 3-1.1: Warning! Unlikely big volume step count (=32767),
#              linear volume or wrong cval->res?
#   usb 3-1.1: [9] FU [Mic Capture Volume] ch = 1, val = -32768/-1/1
#
# and /proc/asound/card2/usbmixer confirms it:
#
#   Control: "Mic Capture Volume"  min=-32768 max=-1  dBmin=-12800 dBmax=0
#   Control: "Mic Capture Switch"  type="INV_BOOLEAN"   <-- inverted mute
#
# An inverted mute plus a 32767-step volume range is a good way to end up
# with a silent mic that every UI reports as unmuted at 100%. Forcing the
# software mixer means WirePlumber applies volume in PipeWire and never
# writes those controls.
#
# ---------------------------------------------------------------------------
# NOT set here: session.suspend-timeout-seconds
#
# It was briefly set to 0, on the theory that this device wedges when its
# capture PCM is closed and reopened. Setting it to 0 keeps the PCM open
# permanently, which keeps the camera's mic LED lit 24/7 -- the mic is
# genuinely streaming, even with zero clients.
#
# Tested 2026-09-11 and the theory did not hold: with the default 5s timeout,
# four consecutive idle -> capture cycles (PCM confirmed at "Status: Stop"
# while idle) all returned full data. A wireplumber restart did not wedge it
# either. The silent-wedge episodes earlier that day happened with a
# different USB cable, which has since been replaced; the cable is the more
# likely culprit.
#
# Do not re-add this setting without re-testing -- it trades a live
# microphone for a problem that may not exist.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.usb-Insta360.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
]
