# Route programmatic browser opens through xdg-open -> chromium.desktop ->
# chromium-tailnet -> chromium-profile, so they get profile routing and the PAC.
# Without this, Python's webbrowser (aws sso login, etc.) matches the default
# chromium.desktop to its built-in "chromium" entry and execs /usr/bin/chromium
# directly, bypassing the wrappers and landing in the last-used profile.
BROWSER=xdg-open
