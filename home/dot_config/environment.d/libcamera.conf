# Point libcamera's software-ISP (simple pipeline) at a colour tuning file that
# adds a CCM over the stock chain. AGC/exposure is handled correctly by libcamera
# 0.7.2+ itself (sensor helper + proportional AGC); this is colour-only.
# Delete this file (and re-login) once upstream ships a calibrated ov01a10 tuning.
LIBCAMERA_SIMPLE_TUNING_FILE=$HOME/.config/libcamera/ov01a10-tuned.yaml
