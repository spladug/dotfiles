packages = [
  "bat",
  "bat-extras",
  "bind",  # dig, nslookup
  "eza",
  "fzf",
  "github-cli",
  "git-delta",
  "htop",
  "jq",
  "ncdu",
  "pyright",  # for vim+ale
  "ripgrep",
  "restic",
  "ruff",
  "socat",  # optional dep of claude-code (sandbox)
  "sops",
  "starship",
  "vim",
  "vim-airline",
  "vim-ale",
  # no vim-fugitive: dropped from the AUR since this was first installed
  # (2025-12-27, 3.7-3). only vim-fugitive-git and neovim-fugitive remain, so
  # the name resolved to nothing and made `paru -S` fail -- which, because
  # `paru -S a b c` installs nothing if any one target is bad, meant NO packages
  # installed on a fresh box. add vim-fugitive-git if you want it back.
  # no vim-fzf-git: fzf.vim is a pinned git submodule under
  # ~/.config/vim/pack/spladug/start, same as commentary, so updates are a
  # reviewed diff instead of a PKGBUILD change.
  "yamllint", # for vim+ale
  "zoxide",
  "zsh",
  "zsh-autosuggestions",
  "zsh-history-substring-search",
  "zsh-syntax-highlighting",
]
