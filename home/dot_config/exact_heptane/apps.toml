packages = [
    "1password",
    "chromium",
    # cider: removed 2026-11-24. it is paid; the AUR "cider" package is v1, not
    # the v2 actually in use, so reinstall it from wherever v2 comes from.
    "discord",
    "firefox",
    "gimp",
    "inkscape",
    "obsidian",
    "pgcli",
    "signal-desktop",
    # no slack-electron-debug: it does not exist in the AUR. slack-electron just
    # repackages an upstream .deb, so there is nothing to build and no debug
    # symbols to split out. listing it made every `paru -S` fail with
    # "target not found", which aborted heptane's whole package sync.
    "slack-electron",
    "syncthing",
]
